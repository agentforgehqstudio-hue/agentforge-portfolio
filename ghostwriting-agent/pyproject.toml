[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter"
version = "0.0.1"
description = "Skeleton copy for a portfolio (implementation removed)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "anthropic>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.40"]

[project.scripts]
gw = "ghostwriter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
